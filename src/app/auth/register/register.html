<div class="container mt-5">
  <div class="row">
    <div class="col-md-4 mx-auto">
      <div class="card">
        <div class="card-header text-center">Registro</div>
        <div class="card-body">
          <form (ngSubmit)="onRegister()" #f="ngForm">
            <div class="form-group mb-3">
              <label for="name">Nombre</label>
              <input type="text" id="name" name="name" class="form-control" [(ngModel)]="name" required minlength="3">
            </div>
            <div class="form-group mb-3">
              <label for="email">Correo Electrónico</label>
              <input type="email" id="email" name="email" class="form-control" [(ngModel)]="email" required>
            </div>
            <div class="form-group mb-3">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-outline-primary w-100" [disabled]="!f.valid">Registrarse</button>
          </form>
          <div class="mt-3 text-center">
            <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
