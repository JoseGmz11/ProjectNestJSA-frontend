<div class="container mt-5">
  <div class="row">
    <div class="col-md-4 mx-auto">
      <div class="card">
        <div class="card-header text-center">Iniciar Sesión</div>
        <div class="card-body">
          <form (ngSubmit)="onLogin()" #f="ngForm">
            <div class="form-group mb-3">
              <label for="email">Correo Electrónico</label>
              <input type="email" id="email" name="email" class="form-control" [(ngModel)]="email" required>
            </div>
            <div class="form-group mb-3">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password" required>
            </div>
            <button type="submit" class="btn btn-outline-success w-100" [disabled]="!f.valid">Entrar</button>
          </form>
          <div class="mt-3 text-center">
            <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
