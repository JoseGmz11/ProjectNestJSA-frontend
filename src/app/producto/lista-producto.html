@if (!listaVacia) {
  <div class="container">
    <table class="table table dark">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Nombre</th>
          <th scope="col">Precio</th>
          <th scope="col">Ver</th>
          <th scope="col">Editar</th>
          <th scope="col">Eliminar</th>
        </tr>
      </thead>
      <tbody>
        @for (producto of productos; track producto.id) {
          <tr>
            <td>{{ producto.id }}</td>
            <td>{{ producto.nombre }}</td>
            <td>{{ producto.precio }}$</td>
            <td>
              <button class="btn btn-primary" routerLink="/detalle/{{ producto.id }}">
                <i class="far fa-eye"></i>Ver
              </button>
            </td>
            <td>
              <button class="btn btn-warning" routerLink="/editar/{{ producto.id }}">
                <i class="far fa-edit"></i>Editar
              </button>
            </td>
            <td>
              <button class="btn btn-danger" (click)="borrar(producto.id!)">
                <i class="far fa-trash-alt"></i>Eliminar
              </button>
            </td>
          </tr>
        } 
      </tbody>
    </table>
  </div>
}

@if(listaVacia) {
  <div class="container">
    <div class="p-3 mb-2 bg-dark text-white text-center"><h2>{{listaVacia}}</h2></div>
  </div>
}
